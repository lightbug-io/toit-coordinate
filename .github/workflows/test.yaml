name: Tests

on:
    push:
        # PR events validate feature branches without a duplicate push run.
        branches:
            - main
        tags:
            - '**'
    pull_request:
        branches:
            - 'main'
        
# Only superseded runs for the same pull request may cancel each other.
# Give push, tag, and manual runs unique groups so they remain independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    test:
        name: Tests
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v4

        - uses: toitlang/action-setup@v1
          with:
            toit-version: 'v2.0.0-alpha.120'

        - run: make test
